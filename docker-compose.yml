services:
  web:
    build: .
    command: npm run start:self-host
    environment:
      NODE_ENV: production
      NOCANVA_APPROVAL_MODE: ${NOCANVA_APPROVAL_MODE:-agent_allowed}
      NOCANVA_AUTH_MODE: ${NOCANVA_AUTH_MODE:-disabled}
      NOCANVA_APP_TOKEN: ${NOCANVA_APP_TOKEN:-}
      NOCANVA_WORKSPACE_ID: ${NOCANVA_WORKSPACE_ID:-default}
      PORT: 3000
    ports:
      - "127.0.0.1:${NOCANVA_WEB_PORT:-3000}:3000"
    volumes:
      - nocanva_data:/app/.wrangler
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  mcp:
    build: .
    command: npm run mcp:http
    depends_on:
      web:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NOCANVA_ALLOW_REMOTE_APP_URL: "1"
      NOCANVA_BASE_URL: http://web:3000
      NOCANVA_MCP_HOST: 0.0.0.0
      NOCANVA_MCP_PORT: 3100
      NOCANVA_MCP_RATE_LIMIT: ${NOCANVA_MCP_RATE_LIMIT:-120}
      NOCANVA_RENDER_TIMEOUT_MS: ${NOCANVA_RENDER_TIMEOUT_MS:-45000}
      NOCANVA_MCP_TOKEN: ${NOCANVA_MCP_TOKEN:?Run npm run self-host first}
      NOCANVA_APP_TOKEN: ${NOCANVA_APP_TOKEN:-}
      NOCANVA_WORKSPACE_ID: ${NOCANVA_WORKSPACE_ID:-default}
    ports:
      - "${NOCANVA_MCP_BIND_IP:-127.0.0.1}:${NOCANVA_MCP_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nocanva_data:
