  <rect width="1080" height="1350" fill="url(#bg)"/><rect x="0" y="0" width="1080" height="20" fill="#5d1977"/>
  <text x="60" y="82" font-family="Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="2.6" fill="#005641">CLASSIC GRAPE / VERIFIED LABEL</text>
  <text x="56" y="228" font-family="Georgia,serif" font-size="106" font-weight="700" letter-spacing="-5" fill="#321039">Read the can.</text><text x="60" y="288" font-family="Arial,sans-serif" font-size="24" fill="#604b64">Four facts. One current 355 mL serving.</text>
