  <text x="585" y="1168" font-family="Arial,sans-serif" font-size="13" fill="#604b64">Official current nutrition panel · per 1 can (355 mL)</text><line x1="60" y1="1232" x2="1020" y2="1232" stroke="#321039" stroke-opacity=".2"/><text x="60" y="1282" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#005641">NO COMPARISON. JUST THE LABEL.</text><text x="1020" y="1282" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#604b64">OLIPOP Classic Grape · 9g Fiber line</text>
