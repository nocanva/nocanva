<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">State survives the conversation.</title>
  <desc id="description">Cloudflare Agents SDK campaign study contrasting transient conversation fragments with a persistent state layer.</desc>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090b" stop-opacity="0.2"/>
      <stop offset="0.52" stop-color="#07090b" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#07090b" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c20" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0f1114" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <image x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" xlink:href="background-v1.png"/>
  <rect width="1080" height="1350" fill="url(#veil)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="72" fill="#f7f7f2" font-size="18" font-weight="700" letter-spacing="2.8">CLOUDFLARE / AGENTS SDK</text>
    <circle cx="1010" cy="68" r="7" fill="#f48120"/>
    <text x="68" y="180" fill="#f7f7f2" font-size="82" font-weight="760" letter-spacing="-3.8">State survives</text>
    <text x="68" y="261" fill="#f48120" font-size="82" font-weight="760" letter-spacing="-3.8">the conversation.</text>
    <text x="73" y="331" fill="#d7d8d5" font-size="23">Conversation moves. The agent keeps its state.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.7">
    <text x="715" y="704" fill="#d9dbd9">TRANSIENT MESSAGES</text>
    <text x="747" y="1032" fill="#ffffff">PERSISTENT STATE</text>
  </g>
  <path d="M 851 1014 L 851 972 L 896 944" fill="none" stroke="#f48120" stroke-width="2"/>
  <circle cx="899" cy="942" r="7" fill="#f48120"/>

  <g>
    <rect x="64" y="770" width="498" height="324" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.15"/>
    <g font-family="SFMono-Regular, SF Mono, Menlo, Consolas, monospace">
      <text x="94" y="816" fill="#9b9d99" font-size="14" font-weight="700" letter-spacing="1.7">STATE / SERVER.TS</text>
      <text x="94" y="870" fill="#f7f7f2" font-size="18"><tspan fill="#9fe4c4">initialState</tspan><tspan> = { count: </tspan><tspan fill="#f6b56c">0</tspan><tspan> };</tspan></text>
      <text x="94" y="930" fill="#f7f7f2" font-size="18"><tspan>this.</tspan><tspan fill="#f6b56c">setState</tspan><tspan>({</tspan></text>
      <text x="94" y="962" fill="#f7f7f2" font-size="18">  count: this.state.count + 1</text>
      <text x="94" y="994" fill="#f7f7f2" font-size="18">});</text>
      <text x="94" y="1050" fill="#f48120" font-size="15" font-weight="700">STATE SURVIVES RESTARTS,</text>
      <text x="94" y="1074" fill="#f48120" font-size="15" font-weight="700">DEPLOYS, AND HIBERNATION.</text>
    </g>
  </g>

  <line x1="66" y1="1264" x2="1014" y2="1264" stroke="#ffffff" stroke-opacity="0.22"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d7d8d5">
    <text x="68" y="1304" font-weight="700" letter-spacing="1.8">DURABLE STATE / REAL-TIME CONNECTIONS</text>
    <text x="1012" y="1304" text-anchor="end">developers.cloudflare.com/agents →</text>
  </g>
</svg>
