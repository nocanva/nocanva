<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">Claim versus record: idle is not the same as below full capacity.</title>
  <desc id="description">Blindspot receipt-versus-claim poster pairing the viral ethanol video frame with the official document.</desc>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121318"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0ede5"/><stop offset="1" stop-color="#dcd6ca"/></linearGradient>
    <clipPath id="claim"><rect x="58" y="424" width="444" height="650" rx="22"/></clipPath>
    <clipPath id="record"><rect x="578" y="424" width="444" height="650" rx="22"/></clipPath>
  </defs>
  <rect x="0" y="0" width="540" height="1350" fill="url(#left)"/>
  <rect x="540" y="0" width="540" height="1350" fill="url(#right)"/>
  <rect x="532" y="0" width="16" height="1350" fill="#ef402f"/>

  <text x="70" y="74" fill="#f5f2ea" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="2.5">THE CLAIM</text>
  <text x="1010" y="74" fill="#1b1a17" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="2.5">THE RECORD</text>

  <text x="70" y="172" fill="#f5f2ea" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="760" letter-spacing="-2.8">“Idle for</text>
  <text x="70" y="232" fill="#f5f2ea" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="760" letter-spacing="-2.8">364 days.”</text>
  <text x="1010" y="154" fill="#1b1a17" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-size="49" font-weight="700" letter-spacing="-2">“Not at full</text>
  <text x="1010" y="208" fill="#1b1a17" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-size="49" font-weight="700" letter-spacing="-2">capacity</text>
  <text x="1010" y="262" fill="#1b1a17" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-size="49" font-weight="700" letter-spacing="-2">year-round.”</text>

  <rect x="426" y="290" width="228" height="66" rx="33" fill="#ef402f"/>
  <text x="540" y="331" fill="#fff9f1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="2">NOT THE SAME</text>

  <image x="58" y="424" width="444" height="650" preserveAspectRatio="xMidYMid slice" clip-path="url(#claim)" xlink:href="../../../assets/blindspot-ethanol-frame.jpg"/>
  <rect x="58" y="424" width="444" height="650" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>

  <image x="578" y="424" width="444" height="574" preserveAspectRatio="xMidYMin slice" clip-path="url(#record)" xlink:href="../../../assets/pib-multifeed-ethanol.png"/>
  <rect x="578" y="424" width="444" height="650" rx="22" fill="#fff" fill-opacity="0.02" stroke="#1b1a17" stroke-opacity="0.18"/>
  <rect x="618" y="598" width="364" height="82" rx="10" fill="#ffdf45" fill-opacity="0.28" stroke="#ef402f" stroke-width="4"/>

  <text x="70" y="1134" fill="#f5f2ea" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Viral wording</text>
  <text x="70" y="1164" fill="#aaa7a1" font-family="Arial, Helvetica, sans-serif" font-size="17">No reliable source establishes the number.</text>
  <text x="1010" y="1134" fill="#1b1a17" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Official wording</text>
  <text x="1010" y="1164" fill="#5a554d" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17">A capacity constraint—not year-long idleness.</text>

  <text x="70" y="1284" fill="#f5f2ea" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="2">CLAIM</text>
  <text x="1010" y="1284" fill="#1b1a17" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="2">SOURCE · CONTEXT · BLINDSPOT</text>
</svg>
