<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">Not at full capacity is not idle for 364 days.</title>
  <desc id="description">Blindspot missing-context poster built around the decisive sentence in an official Ministry of Cooperation document.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f0e8"/><stop offset="1" stop-color="#ddd8cc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#2b2016" flood-opacity="0.28"/></filter>
    <clipPath id="doc"><rect x="218" y="456" width="800" height="720" rx="18"/></clipPath>
  </defs>
  <rect width="1080" height="1350" fill="url(#paper)"/>
  <circle cx="72" cy="69" r="8" fill="#ef402f"/>
  <text x="96" y="76" fill="#1b1a17" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="2.5">BLINDSPOT / WHAT IT LEAVES OUT</text>
  <text x="1008" y="76" fill="#736f67" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">OFFICIAL RECORD</text>

  <text x="70" y="183" fill="#1b1a17" font-family="Georgia, Times New Roman, serif" font-size="69" font-weight="700" letter-spacing="-2.6">“Not at full capacity”</text>
  <text x="70" y="257" fill="#1b1a17" font-family="Georgia, Times New Roman, serif" font-size="69" font-weight="700" letter-spacing="-2.6">is not “idle for</text>
  <text x="70" y="331" fill="#ef402f" font-family="Georgia, Times New Roman, serif" font-size="69" font-weight="700" letter-spacing="-2.6">364 days.”</text>
  <text x="74" y="400" fill="#55514a" font-family="Arial, Helvetica, sans-serif" font-size="23">The decisive distinction was already in the source.</text>

  <g filter="url(#shadow)"><rect x="202" y="440" width="832" height="752" rx="24" fill="#ffffff"/></g>
  <image x="218" y="456" width="800" height="1036" preserveAspectRatio="xMidYMin meet" clip-path="url(#doc)" xlink:href="../../../assets/pib-multifeed-ethanol.png"/>
  <rect x="304" y="764" width="624" height="91" rx="12" fill="#ffdf45" fill-opacity="0.22" stroke="#ef402f" stroke-width="4"/>
  <path d="M 244 809 L 292 809" stroke="#ef402f" stroke-width="4"/>
  <rect x="56" y="778" width="188" height="62" rx="31" fill="#ef402f"/>
  <text x="150" y="816" fill="#fff9f1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="1.4">WHAT IT SAYS</text>

  <line x1="70" y1="1242" x2="1010" y2="1242" stroke="#1b1a17" stroke-opacity="0.18"/>
  <text x="72" y="1285" fill="#1b1a17" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="2">READ THE RECEIPT.</text>
  <text x="1008" y="1285" fill="#55514a" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15">Ministry of Cooperation annexure · Mar 2025</text>
</svg>
