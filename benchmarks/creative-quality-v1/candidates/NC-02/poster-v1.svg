<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Your agent creates. You make the call.</title><desc id="desc">NoCanva human-approval workflow poster using current first-party UI.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7f5ef"/><stop offset="1" stop-color="#e9e5dc"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#443d34" flood-opacity=".25"/></filter><clipPath id="shot"><rect x="78" y="485" width="924" height="590" rx="28"/></clipPath></defs>
  <rect width="1080" height="1350" fill="url(#bg)"/><rect width="1080" height="18" fill="#1d1e1e"/><text x="58" y="78" font-family="Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="2.5" fill="#1d1e1e">NOCANVA / HUMAN IN THE LOOP</text>
  <text x="54" y="200" font-family="Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-4" fill="#161717">Your agent creates.</text><text x="54" y="275" font-family="Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-4" fill="#16724a">You make the call.</text><text x="58" y="348" font-family="Arial,sans-serif" font-size="24" fill="#5c5851">Research, revisions, and review arrive ready for a human decision.</text>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2"><rect x="58" y="394" width="164" height="46" rx="23" fill="#1d1e1e"/><text x="140" y="423" text-anchor="middle" fill="#fff">01 · AGENT</text><path d="M222 417H286" stroke="#777168" stroke-width="2"/><rect x="286" y="394" width="164" height="46" rx="23" fill="#fff" stroke="#aaa59d"/><text x="368" y="423" text-anchor="middle" fill="#1d1e1e">02 · REVIEW</text><path d="M450 417H514" stroke="#777168" stroke-width="2"/><rect x="514" y="394" width="244" height="46" rx="23" fill="#16724a"/><text x="636" y="423" text-anchor="middle" fill="#fff">03 · HUMAN APPROVAL</text><path d="M758 417H822" stroke="#777168" stroke-width="2"/><rect x="822" y="394" width="200" height="46" rx="23" fill="#fff" stroke="#aaa59d"/><text x="922" y="423" text-anchor="middle" fill="#1d1e1e">04 · EXPORT</text></g>
  <g filter="url(#sh)"><rect x="62" y="469" width="956" height="622" rx="38" fill="#fff"/></g><image x="78" y="485" width="924" height="590" preserveAspectRatio="xMidYMid slice" clip-path="url(#shot)" xlink:href="../../assets/nocanva/blindspot-approved-draft.png"/>
  <rect x="694" y="952" width="276" height="86" rx="18" fill="#16724a"/><text x="832" y="986" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.3" fill="#fff">HUMAN DECISION</text><text x="832" y="1018" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">Approval stays yours.</text>
  <line x1="58" y1="1188" x2="1022" y2="1188" stroke="#1d1e1e" stroke-opacity=".2"/><text x="58" y="1240" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#1d1e1e">Agents do the production work.</text><text x="1022" y="1240" text-anchor="end" font-family="Arial,sans-serif" font-size="17" fill="#5c5851">Only a human approves the final revision.</text>
